name: Build iOS App

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Clean Windows modules and install Mac dependencies
        run: |
          rm -rf node_modules ios
          npm install
          chmod -R +x node_modules/.bin

      - name: Add and Sync iOS platform
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Build unsigned iOS Archive
        run: |
          cd ios/App
          if [ -d "App.xcworkspace" ]; then
            xcodebuild -workspace App.xcworkspace -scheme App -sdk iphoneos -configuration Release archive -archivePath build/App.xcarchive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          else
            xcodebuild -project App.xcodeproj -scheme App -sdk iphoneos -configuration Release archive -archivePath build/App.xcarchive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          fi

      - name: Package IPA file
        run: |
          mkdir -p Payload
          cp -r ios/App/build/App.xcarchive/Products/Applications/App.app Payload/
          zip -r Servio-iOS.ipa Payload

      - name: Upload Downloadable IPA
        uses: actions/upload-artifact@v4
        with:
          name: Servio-iOS-App
          path: Servio-iOS.ipa